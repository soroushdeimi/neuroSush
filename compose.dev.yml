services:
  studio:
    build:
      target: dev
    volumes:
      - ./src:/workspace/src:ro
      - ./gui/server/studio:/workspace/gui/server/studio:ro
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-dev
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NS_API_PROXY: http://studio:8000
    volumes:
      - ./gui/web/src:/web/src:ro
    read_only: true
    tmpfs:
      - /tmp
      - /web/node_modules/.vite
      - /web/node_modules/.vite-temp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
