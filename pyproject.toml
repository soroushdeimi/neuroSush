[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neurosush"
dynamic = ["version"]
description = "Spiking cortical networks on PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sush", email = "soroushdeimi@gmail.com" }]
dependencies = ["torch>=2.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5", "pre-commit>=3", "mypy>=1.10"]

[tool.hatch.version]
path = "src/neurosush/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neurosush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = ["gpu: needs a CUDA device; skipped without one"]
filterwarnings = [
    "error",
    # torch warns at import when the optional numpy is absent (as in CI); not our concern
    "ignore:Failed to initialize NumPy:UserWarning",
]

[tool.coverage.run]
source = ["neurosush"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "D", "C4", "PIE", "RET"]
ignore = ["D105", "D107", "N812"]  # N812: `import torch.nn.functional as F` is the torch idiom

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
files = ["src"]
# checks run as 3.12 because NumPy's stubs need it; ruff (py310) and the 3.10 CI job
# guard the package's own 3.10 compatibility
python_version = "3.12"
strict = true
