name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'demos/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'demos/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.filter.outputs.library == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            library:
              - 'src/neurosush/**'
              - '!src/neurosush/viz/web/**'
              - 'tests/**'
              - '!tests/viz/js/**'
              - '!tests/site/**'
              - 'examples/**'
              - 'benchmarks/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "mypy>=1.10"
      - run: mypy

  test:
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            torch: latest
          - os: ubuntu-latest
            python: '3.12'
            torch: latest
          - os: ubuntu-latest
            python: '3.13'
            torch: latest
          - os: ubuntu-latest
            python: '3.10'
            torch: '2.1.0'
    steps: &test-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        run: pip install "${{ matrix.torch == 'latest' && 'torch' || format('torch=={0}', matrix.torch) }}" --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: pip install torch
      - run: pip install -e ".[dev]"
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest --cov --cov-report=xml --cov-fail-under=90
      - if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: pytest
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  test-extra:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            torch: latest
          - os: macos-latest
            python: '3.12'
            torch: latest
    steps: *test-steps

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test the wheel in a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -c "import neurosush; print(neurosush.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
