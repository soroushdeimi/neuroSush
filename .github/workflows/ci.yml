name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "mypy>=1.10"
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        torch: [latest]
        include:
          - os: macos-latest
            python: '3.12'
            torch: latest
          # the oldest torch that pyproject.toml allows: catches newer-only APIs
          - os: ubuntu-latest
            python: '3.10'
            torch: '2.1.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: pip install "${{ matrix.torch == 'latest' && 'torch' || format('torch=={0}', matrix.torch) }}" --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: pip install torch
      - run: pip install -e ".[dev]"
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest --cov --cov-report=xml --cov-fail-under=90
      - if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: pytest
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test the wheel in a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -c "import neurosush; print(neurosush.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
