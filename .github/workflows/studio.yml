name: Studio
on:
  pull_request:
    paths: ['gui/**', 'src/neurosush/introspect.py', 'tests/introspect/**', 'docker/**', 'compose*.yml', '.github/workflows/studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - run: npm --prefix gui/web ci
      - run: npm --prefix gui/web run typecheck && npm --prefix gui/web run lint && npm --prefix gui/web test && npm --prefix gui/web run build
      - run: docker compose config --quiet && docker compose -f compose.yml -f compose.gpu.yml config --quiet && docker compose -f compose.yml -f compose.dev.yml config --quiet
  python:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src:gui/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --project gui/server --frozen
      - run: uv run --project gui/server ruff check src gui/server tests/introspect
      - run: uv run --project gui/server ruff format --check src/neurosush/introspect.py gui/server tests/introspect
      - run: uv run --project gui/server mypy src gui/server/studio
      - run: uv run --project gui/server pytest tests/introspect tests/structure/test_spec.py gui/server/tests -q
